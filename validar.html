<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Validar cupón · Maxicenter</title>
<style>
:root{--bg:#0b1030;--card:#141b45;--line:#2b3680;--gold:#ffc93c;--txt:#f3f6ff;--muted:#a3adde;--ok:#1fae56;--bad:#fe0000;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:600 17px/1.4 system-ui,sans-serif}
main{max-width:440px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:24px;color:var(--gold)}p{margin:0;color:var(--muted);font-size:15px}
input{width:100%;font:900 24px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;padding:12px;border-radius:12px;border:2px solid var(--line);background:#060918;color:var(--txt)}
button{font:900 18px system-ui;padding:12px;border-radius:12px;border:0;background:var(--gold);color:#3a2200;cursor:pointer}
#r{border-radius:14px;padding:14px;font-size:18px;font-weight:900;display:none}
#r.ok{display:block;background:var(--ok)}#r.bad{display:block;background:var(--bad)}
</style>
</head>
<body>
<main>
  <h1>Validar cupón del Duelo en la Posada</h1>
  <p>Para uso de la tienda. Escribe el código que te manda el cliente (ej. MX2-ABCD-EF).</p>
  <input id="c" placeholder="MX1-XXXX-XX" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button id="b">Validar</button>
  <div id="r"></div>
  <p>Anota los códigos que ya se usaron: cada código vale una sola vez.</p>
</main>
<script>
/* Debe coincidir con el juego (index.html). */
const CUPON_PCT=[1,5,10],LVL=["Crudo","Alegrito","Prendido"];
const CUP_AB="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",CUP_SAL="posada-maxi-24";
function cupSum(l,r){let h=2166136261;for(const ch of "MX"+l+r+CUP_SAL){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return CUP_AB[h%32]+CUP_AB[(h>>>5)%32]}
function check(){const v=document.getElementById("c").value.toUpperCase().replace(/[^A-Z0-9]/g,""),r=document.getElementById("r");
  const m=v.match(/^MX([123])([A-Z0-9]{4})([A-Z0-9]{2})$/);
  if(m&&cupSum(+m[1],m[2])===m[3]){const l=+m[1]-1;r.className="ok";r.textContent=`Válido: ${CUPON_PCT[l]}% de descuento (nivel ${LVL[l]}).`}
  else{r.className="bad";r.textContent="Código no válido."}}
document.getElementById("b").onclick=check;document.getElementById("c").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
</script>
</body>
</html>
